<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="ico.svg" />
    <!-- Saved to a home screen, iOS ignores the favicon and will screenshot the
         page unless it is handed one of these. It masks its own rounded corners,
         so this one is drawn square and full bleed with the bolt held clear of
         the crop; rounding it here would round it twice and show void at the
         corners. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dedee0" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Keraunos: live global lightning strike detection, streamed from the Blitzortung network." />
    <title>Keraunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the medium before first paint so the tube never flashes on paper.
      // The cookie is set on `.corvardt.com`, so it is shared with the index and
      // every other project.
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)corvardt-theme=(dark|light)/);
        var t = m ? m[1] : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
